[project]
name = "flowguard"
version = "0.1.0"
description = "Context-aware privacy gateway for LLMs"
requires-python = "~=3.12.0"
license = "MIT"
dependencies = [
    "fastapi~=0.141.1",
    "uvicorn~=0.54.0",
    "httpx~=0.28.1",
    "pyyaml~=6.0.3",
    "python-stdnum~=2.2.0",
    "gliner~=0.2.29",
    "torch~=2.14.0",
    # GLiNER tokenizer (DeBERTa SentencePiece) needs these at load time
    "sentencepiece~=0.2.1",
    "protobuf~=7.36.2",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "ruff~=0.16.9",
    "mypy~=2.3.1",
    "types-pyyaml~=6.0.12",
]
baseline = [
    "presidio-analyzer~=2.2.364",
    "spacy~=3.8.16",
    "en-core-web-lg",
]

[tool.uv]
default-groups = ["dev", "baseline"]
# 14-day supply-chain window, also applies to transitive deps
exclude-newer = "2026-09-29T00:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
