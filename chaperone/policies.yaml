# Flow policies. First matching rule wins. A missing key in `when` matches anything.
# Keys: label, subject, role, destination, purpose. Values: one string or a list.
# Actions: pass | pseudonymize | generalize | block. `scope: request` blocks the whole request.
# This file is also the one place that lists sender roles and purposes. Edits are picked up without a restart;
# an invalid edit is refused and the previous rules stay in use. Admin edits from the UI go to
# data/policies.local.yaml, never here.
name: Standard rules
description: Rules for everyday office work.

roles: [Manager, HR, Sales, Intern, Doctor, Accountant]

groups:
  semantic: &SEMANTIC [HEALTH, COMPENSATION, MNPI, HR, LEGAL]
  personal_ids: &PERSONAL_IDS [AADHAAR, PAN, GSTIN, PHONE, EMAIL, UPI, VEHICLE, PERSON, MRN, ACCOUNT, IP]

rules:
  - id: mnpi-never-external
    when: {label: MNPI, destination: external}
    action: block
    scope: request
    why: Unpublished company results or deals sent to a third party is an insider-trading risk (SEBI PIT rules).

  - id: salary-not-for-marketing
    when: {label: COMPENSATION, destination: external, purpose: marketing}
    action: block
    scope: request
    why: Pay data has no place in an external marketing tool.

  - id: business-data-is-routine
    when: {subject: business}
    action: pass
    why: Company PAN, business GSTIN, IFSC and company names are business data, not personal data.

  - id: intern-no-sensitive
    when: {role: Intern, label: *SEMANTIC}
    action: block
    why: Interns are not cleared for health, pay, HR, legal or unpublished financial details.

  - id: intern-ids-masked
    when: {role: Intern, label: *PERSONAL_IDS}
    action: pseudonymize
    why: Interns work on placeholders, not real identities.

  - id: doctor-health-internal
    when: {label: HEALTH, role: Doctor, destination: internal}
    action: pass
    why: Treating doctor, clinic's own model.

  - id: doctor-health-deidentified
    when: {label: HEALTH, role: Doctor, destination: external, purpose: clinical_summary}
    action: pass
    why: Clinical detail may go out only for a clinical summary, and only once identities are pseudonymized.

  - id: pay-hr-finance-internal
    when: {label: COMPENSATION, role: [HR, Accountant], destination: internal}
    action: pass
    why: HR and finance own pay data inside the organisation.

  - id: hr-legal-managers-internal
    when: {label: [HR, LEGAL], role: [HR, Manager], destination: internal}
    action: pass
    why: HR and line managers handle performance and legal matters inside the organisation.

  - id: mnpi-insiders-internal
    when: {label: MNPI, role: [Manager, Accountant], destination: internal}
    action: pass
    why: Designated insiders may discuss unpublished results on internal systems.

  - id: sensitive-need-to-know
    when: {label: *SEMANTIC}
    action: generalize
    why: Sender or destination has no need to know the exact detail; the gist is kept.

  - id: internal-stays-internal
    when: {destination: internal}
    action: pass
    why: Data does not leave the organisation.

  - id: scheduling-needs-names
    when: {label: [PERSON, DATE], destination: external, purpose: scheduling}
    action: pass
    why: A scheduling assistant needs colleague names and dates to do its job.

  - id: clinical-quasi-ids
    when: {label: [AGE, DATE], destination: external, purpose: clinical_summary}
    action: generalize
    why: Exact age and admission date can re-identify a patient; ranges keep clinical meaning.

  - id: quasi-ids-ok
    when: {label: [AGE, DATE, LOCATION]}
    action: pass
    why: Alone, a city, an age or a date does not identify a person here.

  - id: personal-ids-external
    when: {label: *PERSONAL_IDS, destination: external}
    action: pseudonymize
    why: Personal identifiers leave only as placeholders; real values are restored locally.

  - id: links-pass
    when: {label: URL}
    action: pass
    why: A web link is not personal data by itself. Safe Harbor mode treats it as an identifier.

  # catch-all: unknown flows lean cautious but keep the answer usable
  - id: default-cautious
    action: pseudonymize
    why: No rule covers this flow; reversible masking is the safe default.

# Purpose limitation and data minimisation: for each stated purpose, identifiers it does not need. They are omitted
# before anything leaves, even as placeholders. "general" means no purpose was stated, so nothing is assumed unneeded.
# (A 3B model asked "is this needed?" said yes almost every time, so needs are declared here, not guessed.)
# `task` finishes the sentence "Not needed to ..." shown when something is left out.
purposes:
  general: {label: General, task: do what the message asks, omit: []}
  scheduling: {label: Scheduling, task: "schedule meetings, leave or shifts", omit: [UPI, AADHAAR, PAN, GSTIN, IFSC, VEHICLE]}
  hr_summary: {label: HR summary, task: write an HR summary or letter, omit: [UPI, AADHAAR, GSTIN, IFSC, VEHICLE]}
  marketing: {label: Marketing, task: write marketing or public copy, omit: [PHONE, EMAIL, UPI, AADHAAR, PAN, GSTIN, IFSC, VEHICLE]}
  clinical_summary: {label: Clinical summary, task: "write a clinical summary of a patient's care", omit: [PHONE, EMAIL, UPI, AADHAAR, PAN, GSTIN, IFSC, VEHICLE]}
  invoicing: {label: Invoicing, task: "prepare an invoice, bill or payment request", omit: [AADHAAR, VEHICLE]}
