# lint, types and every test that runs without a local model (the 20 scenario tests need Ollama)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions pinned to release commits: v7.0.1 and v10.2.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.19"
          enable-cache: true
      # the Presidio baseline group is only for eval/; no test imports it, and --no-sync keeps run from adding it back
      - run: uv sync --frozen --no-group baseline
      - run: uv run --no-sync ruff check chaperone tests eval
      - run: uv run --no-sync mypy chaperone
      - run: uv run --no-sync pytest -m "not ollama"
